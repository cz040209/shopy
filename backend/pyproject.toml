[project]
name = "shopy-backend"
version = "0.1.0"
description = "FastAPI backend and Agentic AI services for Shopy"
authors = [{ name = "Shopy Team" }]
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic-settings>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
    "httpx>=0.27,<1.0",
    "python-dotenv>=1.0,<2.0",
    "python-multipart>=0.0.20,<1.0",
    "faster-whisper>=1.1,<2.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.14,<2.0",
    "langchain (>=1.0,<2.0)",
    "langgraph (>=1.0,<2.0)",
    "redis>=5,<7",
]

[tool.poetry]
packages = [{ include = "app" }]

[dependency-groups]
dev = ["pytest>=8.3,<10.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
