name: shopy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - path: ./compose.defaults.env
      - path: ./backend/.env
        required: false
    volumes:
      - shopy_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - shopy_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - path: ./compose.defaults.env
      - path: ./backend/.env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
      FRONTEND_ORIGIN: http://localhost:8002
      UPLOAD_DIRECTORY: /app/data/uploads
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.7-flash}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope-intl.aliyuncs.com/compatible-mode/v1}
      QWEN_MODEL: ${QWEN_MODEL:-qwen3.6-flash}
      QWEN_VISION_MODEL: ${QWEN_VISION_MODEL:-qwen3.5-omni-plus}
      QWEN_AUDIO_MODEL: ${QWEN_AUDIO_MODEL:-qwen3-omni-30b-a3b-captioner}
    volumes:
      - shopy_uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - python
      - app/docker_entrypoint.py
      - /bin/sh
      - -c
      - >-
        poetry run alembic upgrade head &&
        poetry run uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_ORIGIN: http://backend:8000
    restart: unless-stopped
    environment:
      BACKEND_ORIGIN: http://backend:8000
      NEXT_PUBLIC_BACKEND_API_URL: ""
      NEXT_PUBLIC_ASSISTANT_API_URL: ""
    ports:
      - "8002:3000"
    depends_on:
      backend:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - path: ./compose.defaults.env
      - path: ./backend/.env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIRECTORY: /app/data/uploads
    volumes:
      - shopy_uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python app/docker_entrypoint.py poetry run celery -A app.worker:celery_app worker --loglevel=INFO --uid=nobody --gid=nogroup

volumes:
  shopy_postgres_data:
  shopy_redis_data:
  shopy_uploads:
